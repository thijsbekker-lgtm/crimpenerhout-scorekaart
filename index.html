<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Crimpenerhout – Scorekaart</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f4ef;color:#06384a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:auto;padding:14px 10px 28px}
h1{text-align:center;font-size:28px;margin:5px 0 14px;font-weight:600}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.back{font-size:38px;line-height:1;color:#12a9c5}
.settings{margin-left:auto;background:#fff;border:1px solid #ddd;border-radius:10px;padding:8px 10px;font-size:14px}
.controls{display:flex;gap:8px;margin-bottom:10px}
.controls label{background:#fff;border-radius:10px;padding:7px 10px;font-size:12px;color:#557}
.controls input{width:45px;border:0;border-bottom:1px solid #aaa;text-align:center;font-size:16px;font-weight:700;background:transparent}
table{width:100%;border-collapse:collapse;background:#fff}
th{height:48px;font-size:13px;color:#8aa0a5;letter-spacing:.8px}
td{height:76px;text-align:center;border-bottom:2px solid #e7e5df;font-size:22px}
td+td{border-left:2px solid #e7e5df}
.hole{font-weight:500}.par{font-weight:500}
.par small{font-size:13px;vertical-align:super;margin-left:2px}
.scorebox{display:flex;align-items:center;justify-content:center;gap:7px}
.scorebox button{border:0;background:#eef0ed;border-radius:50%;width:38px;height:38px;font-size:22px;color:#06384a}
.score{min-width:25px;font-weight:600}
.sf{font-weight:500}
.total td{height:70px;border-bottom:0;font-size:24px;font-weight:600}
.total td:first-child{text-align:center}
.total td+td{border-left:2px solid #ddd}
.note{margin-top:12px;text-align:center;color:#65777c;font-size:12px;line-height:1.4}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="back">‹</div><h1 style="flex:1">Scorekaart</h1></div>
<div class="controls">
<label>Handicap-slagen <input id="hcp" type="number" min="0" max="54" value="6"></label>
<button class="settings" onclick="resetScores()">Nieuwe ronde</button>
</div>
<table>
<thead><tr><th>HOLE</th><th>PAR<small>+IK</small></th><th>SLAGEN</th><th>STABLEFORD</th></tr></thead>
<tbody id="rows"></tbody>
<tfoot><tr class="total"><td colspan="2">Totaal</td><td id="total">0</td><td id="sftotal">0</td></tr></tfoot>
</table>
<div class="note">Geel • 9 holes • Par 33 • CR 68,8 • Slope 124<br>IK = handicapslag op die hole. Bij 6 handicapslagen krijgt SI 1 t/m 6 één slag.</div>
</div>
<script>
const holes=[[1,4,11],[2,3,17],[3,4,5],[4,3,9],[5,4,3],[6,3,15],[7,4,13],[8,5,1],[9,3,7]];
const scores={};
const rows=document.getElementById('rows');
const hcp=document.getElementById('hcp');
const savedHcp=localStorage.getItem('crimp_hcp');
if(savedHcp!==null)hcp.value=savedHcp;

holes.forEach(h=>{
 scores[h[0]]=+(localStorage.getItem('crimp_'+h[0])||0);
 rows.innerHTML+=`<tr>
 <td class="hole">${h[0]}</td>
 <td class="par">${h[1]}<small id="ik${h[0]}"></small></td>
 <td><div class="scorebox"><button onclick="chg(${h[0]},-1)">−</button><span class="score" id="s${h[0]}">${scores[h[0]]||'—'}</span><button onclick="chg(${h[0]},1)">+</button></div></td>
 <td class="sf" id="f${h[0]}">—</td>
 </tr>`;
});

function strokes(si){
 let x=Math.max(0,+hcp.value||0);
 return Math.floor(x/9)+(si<=x%9?1:0);
}
function sf(par,score,si){
 if(!score)return null;
 return Math.max(0,2+par-(score-strokes(si)));
}
function update(){
 let total=0,sftotal=0;
 holes.forEach(h=>{
  const v=scores[h[0]]||0;
  const st=strokes(h[2]);
  const ik=document.getElementById('ik'+h[0]);
  ik.textContent=st?` +${st}`:'';
  if(v)total+=v;
  const p=sf(h[1],v,h[2]);
  document.getElementById('f'+h[0]).textContent=p===null?'—':p;
  if(p!==null)sftotal+=p;
 });
 document.getElementById('total').textContent=total;
 document.getElementById('sftotal').textContent=sftotal;
}
function chg(h,d){
 scores[h]=Math.max(0,scores[h]+d);
 localStorage.setItem('crimp_'+h,scores[h]);
 document.getElementById('s'+h).textContent=scores[h]||'—';
 update();
}
function resetScores(){
 if(confirm('Alle scores van deze ronde wissen?')){
  holes.forEach(h=>{scores[h[0]]=0;localStorage.removeItem('crimp_'+h[0]);document.getElementById('s'+h[0]).textContent='—';});
  update();
 }
}
hcp.oninput=()=>{localStorage.setItem('crimp_hcp',hcp.value);update()};
update();
</script>
</body>
</html>
