<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Golf Scorekaart</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#86868b;--line:#e5e5ea;--blue:#007aff;--blue2:#eaf3ff;--red:#ff3b30}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:620px;margin:auto;padding:20px 12px 42px}
h1{text-align:center;font-size:30px;letter-spacing:-.8px;margin:2px 0 3px;font-weight:700}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:18px}
.settings,.history{background:rgba(255,255,255,.92);border:1px solid rgba(0,0,0,.04);border-radius:22px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.055);margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
label{font-size:11px;color:var(--muted);font-weight:500}
select,input{display:block;width:100%;height:44px;margin-top:5px;padding:0 10px;border:1px solid #d2d2d7;border-radius:12px;background:#fff;text-align:center;font-size:16px;font-weight:600;color:var(--text);outline:none}
select:focus,input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,122,255,.12)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{background:#f5f5f7;border-radius:15px;padding:10px;text-align:center}.stat small{display:block;color:var(--muted);font-size:10px;margin-bottom:3px}.stat b{font-size:17px}
table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.055)}
th{height:44px;font-size:10px;color:var(--muted);letter-spacing:.8px;font-weight:600}
td{height:68px;text-align:center;border-top:1px solid var(--line);font-size:20px}td+td{border-left:1px solid var(--line)}
.hole{font-weight:650}.ik{font-size:11px;vertical-align:super;margin-left:2px;color:var(--blue);font-weight:650}
.scorebox{display:flex;align-items:center;justify-content:center;gap:7px}
.scorebox button{border:0;background:#f2f2f7;color:var(--text);border-radius:50%;width:38px;height:38px;font-size:22px;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.035);-webkit-tap-highlight-color:transparent}
.scorebox button:active{transform:scale(.92);background:#e5e5ea}.score{min-width:25px;font-weight:700}.sf{font-weight:650}
tfoot td{height:70px;border-top:1px solid var(--line);font-weight:700;font-size:21px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.action,.reset{border:0;border-radius:14px;padding:13px;font-size:15px;font-weight:650;-webkit-tap-highlight-color:transparent}
.action{background:var(--blue);color:#fff;box-shadow:0 5px 14px rgba(0,122,255,.18)}
.action.secondary,.reset{background:#e5e5ea;color:var(--text)}.reset{width:100%;margin-top:9px}
.action:active,.reset:active{transform:scale(.98)}
.history h2{font-size:18px;letter-spacing:-.2px;margin:2px 0 8px}
.rounditem{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 2px;border-top:1px solid var(--line);font-size:13px}
.roundopen{flex:1;text-align:left;border:0;background:transparent;color:var(--text);padding:2px}
.roundmeta{color:var(--muted);font-size:11px;margin-top:3px}.delete{border:0;background:#f2f2f7;border-radius:9px;padding:8px 10px;color:var(--red);font-weight:600}
.note{font-size:11px;color:var(--muted);line-height:1.45;text-align:center;margin-top:12px}
@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}.grid label:last-child{grid-column:1/-1}.wrap{padding-left:9px;padding-right:9px}}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989f;--line:#38383a}body{background:var(--bg)}.settings,.history,table{background:var(--card)}select,input{background:#1c1c1e;color:#f5f5f7;border-color:#48484a}.stat,.scorebox button,.action.secondary,.reset,.delete{background:#2c2c2e;color:#f5f5f7}}
@media print{body{background:#fff}.settings,.actions,.history,.note,.reset{display:none!important}.wrap{max-width:none;padding:0}table{box-shadow:none}h1{margin-bottom:20px}}
</style>
</head>
<body>
<div class="wrap">
<h1>Golf Scorekaart</h1>

<div class="settings">
<div class="grid">
<label>Golfbaan
<select id="course">
<option value="crimpenerhout">Crimpenerhout</option>
<option value="kroonprins">De Kroonprins</option>
</select>
</label>
<label>Ronde
<select id="round">
<option value="9">9 holes</option>
<option value="18">18 holes</option>
</select>
</label>
<label id="loopLabel">Lus / baan
<select id="loop">
<option value="first">1e 9</option>
<option value="second">2e 9</option>
</select>
</label>
<label>Handicap Index
<input id="hi" type="number" min="-10" max="54" step="0.1" value="14.2">
</label>
</div>

<div class="stats">
<div class="stat"><small>Baanhandicap</small><b id="courseHcp">—</b></div>
<div class="stat"><small>CR / Slope</small><b id="crsr">—</b></div>
<div class="stat"><small>Par</small><b id="coursePar">—</b></div>
</div>
</div>

<table>
<thead><tr><th>HOLE</th><th>PAR + IK</th><th>SLAGEN</th><th>STABLEFORD</th></tr></thead>
<tbody id="rows"></tbody>
<tfoot><tr><td colspan="2">Totaal</td><td id="total">0</td><td id="sfTotal">0</td></tr></tfoot>
</table>

<div class="actions">
  <button class="action" onclick="saveRound()">💾 Ronde opslaan</button>
  <button class="action secondary" onclick="printRound()">📄 PDF / print</button>
</div>

<button class="reset" onclick="resetScores()">Nieuwe ronde</button>

<div class="history">
  <h2>📋 Mijn rondes</h2>
  <div id="historyList">Nog geen opgeslagen rondes.</div>
</div>

<div class="note" id="note"></div>
</div>

<script>
// -------------------- COURSE DATA --------------------

// Crimpenerhout geel heren, 9 holes.
// SI's are the actual Stroke Index ranking on the 9-hole loop.
const crimp={
 name:"Crimpenerhout",
 nine:{
  first:{
   cr:32.3,sr:107,par:33,
   holes:[[1,4,11],[2,3,17],[3,4,5],[4,3,9],[5,4,3],[6,3,15],[7,4,13],[8,5,1],[9,3,7]]
  }
 },
 eighteen:{
  cr:68.8,sr:124,par:66,
  holes:[
   [1,4,11],[2,3,17],[3,4,5],[4,3,9],[5,4,3],[6,3,15],[7,4,13],[8,5,1],[9,3,7],

// Crimpenerhout 9-hole official men's yellow course-handicap table.
const crimp9Table=[
 [-10,0.4,0],[0.5,2.5,0],[2.6,4.6,1],[4.7,6.7,2],[6.8,8.8,3],
 [8.9,10.9,4],[11.0,13.0,5],[13.1,15.2,6],[15.3,17.3,7],[17.4,19.4,8],
 [19.5,21.5,9],[21.6,23.6,10],[23.7,25.7,11],[25.8,27.8,12],[27.9,29.9,13],
 [30.0,32.1,14],[32.2,34.2,15],[34.3,36.3,16],[36.4,38.4,17],[38.5,40.5,18],

// De Kroonprins 18-hole men's yellow course-handicap table.
// Official table: CR 69.4, par 71, SR 130.
const kp18Table=[
 [-10,0.2,0],[0.3,1.0,1],[1.1,1.9,2],[2.0,2.7,3],[2.8,3.5,4],
 [3.6,4.4,5],[4.5,5.2,6],[5.3,6.1,7],[6.2,6.9,8],[7.0,7.7,9],
 [7.8,8.6,10],[8.7,9.4,11],[9.5,10.2,12],[10.3,11.1,13],[11.2,11.9,14],
 [12.0,12.8,15],[12.9,13.6,16],[13.7,14.4,17],[14.5,15.3,18],[15.4,16.1,19],
 [16.2,16.9,20],[17.0,17.8,21],[17.9,18.6,22],[18.7,19.5,23],[19.6,20.3,24],
 [20.4,21.1,25],[21.2,22.0,26],[22.1,22.8,27],[22.9,23.6,28],[23.7,24.5,29],
 [24.6,25.3,30],[25.4,26.1,31],[26.2,27.0,32],[27.1,27.8,33],[27.9,28.7,34],
 [28.8,29.5,35],[29.6,30.3,36],[30.4,31.2,37],[31.3,32.0,38],[32.1,32.8,39],
 [32.9,33.7,40],[33.8,34.5,41],[34.6,35.4,42],[35.5,36.2,43],[36.3,37.0,44],
 [37.1,37.9,45],[38.0,38.7,46],[38.8,39.5,47],[39.6,40.4,48],[40.5,41.2,49],
 [41.3,42.1,50],[42.2,42.9,51],[43.0,43.7,52],[43.8,44.6,53],[44.7,45.4,54],
 [45.5,46.2,55],[46.3,47.1,56],[47.2,47.9,57],[48.0,48.7,58],[48.8,49.6,59],
 [49.7,50.4,60],[50.5,51.3,61],[51.4,52.1,62],[52.2,52.9,63],[53.0,53.8,64],[53.9,54.0,65]
];

// De Kroonprins 1e 9 men's yellow table: CR 34.5, par 35, SR 132.
const kpFirst9Table=[
 [-10,0.5,0],[0.6,2.2,1],[2.3,3.9,2],[4.0,5.6,3],[5.7,7.3,4],[7.4,9.0,5],
 [9.1,10.7,6],[10.8,12.4,7],[12.5,14.1,8],[14.2,15.8,9],[15.9,17.5,10],
 [17.6,19.2,11],[19.3,20.9,12],[21.0,22.5,13],[22.6,24.2,14],[24.3,25.9,15],
 [26.0,27.6,16],[27.7,29.3,17],[29.4,31.0,18],[31.1,32.7,19],[32.8,34.4,20],
 [34.5,36.1,21],[36.2,37.8,22],[37.9,39.5,23],[39.6,41.2,24],[41.3,42.9,25],
 [43.0,44.6,26],[44.7,46.3,27],[46.4,48.0,28],[48.1,49.7,29],[49.8,51.4,30],
 [51.5,53.1,31],[53.2,54.0,32]
];

// De Kroonprins 2e 9 men's yellow table: CR 35.0, par 36, SR 128.
const kpSecond9Table=[
 [-10,0.8,0],[0.9,2.4,1],[2.5,4.1,2],[4.2,5.8,3],[5.9,7.4,4],[7.5,9.1,5],
 [9.2,10.8,6],[10.9,12.4,7],[12.5,14.1,8],[14.2,15.7,9],[15.8,17.4,10],
 [17.5,19.1,11],[19.2,20.7,12],[20.8,22.4,13],[22.5,24.0,14],[24.1,25.7,15],
 [25.8,27.4,16],[27.5,29.0,17],[29.1,30.7,18],[30.8,32.4,19],[32.5,34.0,20],
 [34.1,35.7,21],[35.8,37.3,22],[37.4,39.0,23],[39.1,40.7,24],[40.8,42.3,25],
 [42.4,44.0,26],[44.1,45.6,27],[45.7,47.3,28],[47.4,49.0,29],[49.1,50.6,30],
 [50.7,52.3,31],[52.4,54.0,32]
];

// Kroonprins main 18-hole yellow scorecard: par and SI.
const kpMain18=[
 [1,4,8],[2,4,14],[3,4,10],[4,3,16],[5,4,2],[6,5,4],[7,4,12],[8,4,6],[9,3,18],
 [10,4,11],[11,4,9],[12,4,13],[13,3,15],[14,5,3],[15,3,7],[16,4,1],[17,4,17],[18,5,5]
];
const kpFirst9=kpMain18.slice(0,9);
const kpSecond9=kpMain18.slice(9,18);

// Kroonprins Par 3 yellow scorecard: par 3 each hole.
// 9-hole SI: 7,17,1,5,15,3,13,11,9.
// 18-hole second loop: 8,18,2,6,16,4,14,12,10.
const kpPar3First9=[
 [1,3,7],[2,3,17],[3,3,1],[4,3,5],[5,3,15],[6,3,3],[7,3,13],[8,3,11],[9,3,9]
];
const kpPar3Second9=[
 [10,3,8],[11,3,18],[12,3,2],[13,3,6],[14,3,16],[15,3,4],[16,3,14],[17,3,12],[18,3,10]
];

// Kroonprins Par 3 official men's tables.
const kpPar3_9Table=[
 [-10,3.0,2],[3.1,6.4,1],[6.5,9.7,0],[9.8,13.1,1],[13.2,16.5,2],
 [16.6,19.9,3],[20.0,23.2,4],[23.3,26.6,5],[26.7,30.0,6],[30.1,33.3,7],
 [33.4,36.7,8],[36.8,40.1,9],[40.2,43.5,10],[43.6,46.8,11],[46.9,50.2,12],
 [50.3,53.6,13],[53.7,54.0,14]
];
const kpPar3_18Table=[
 [-10,0.5,4],[0.6,2.1,4],[2.2,3.8,3],[3.9,5.5,2],[5.6,7.2,1],[7.3,8.9,0],
 [9.0,10.6,1],[10.7,12.3,2],[12.4,13.9,3],[14.0,15.6,4],[15.7,17.3,5],
 [17.4,19.0,6],[19.1,20.7,7],[20.8,22.4,8],[22.5,24.1,9],[24.2,25.8,10],
 [25.9,27.4,11],[27.5,29.1,12],[29.2,30.8,13],[30.9,32.5,14],[32.6,34.2,15],
 [34.3,35.9,16],[36.0,37.6,17],[37.7,39.2,18],[39.3,40.9,19],[41.0,42.6,20],
 [42.7,44.3,21],[44.4,46.0,22],[46.1,47.7,23],[47.8,49.4,24],[49.5,51.1,25],
 [51.2,52.7,26],[52.8,54.0,27]
];

// -------------------- LOGIC --------------------

const course=document.getElementById('course');
const round=document.getElementById('round');
const loop=document.getElementById('loop');
const loopLabel=document.getElementById('loopLabel');
const hi=document.getElementById('hi');
const rows=document.getElementById('rows');
const scores={};

function tableHcp(table,h){
 const row=table.find(r=>h>=r[0] && h<=r[1]);
 return row ? row[2] : null;
}

function currentConfig(){
 const h=+hi.value||0;
 const c=course.value;
 const n=+round.value;
 let holes, cr, sr, par, table, note;

 if(c==='crimpenerhout'){
   if(n===9){
     holes=crimp.nine.first.holes; cr=32.3; sr=107; par=33; table=crimp9Table;
     note='Crimpenerhout geel heren • 9 holes • CR 32,3 / SR 107.';
   }else{
     holes=crimp.eighteen.holes; cr=68.8; sr=124; par=66; table=null;
     // The supplied official 18-hole table is already directly represented
     // by the course handicap values. For the current user's table, 14.2 = 13.
     table='crimp18';
     note='Crimpenerhout geel heren • 18 holes • CR 68,8 / SR 124.';
   }
 }else if(c==='kroonprins'){
   if(n===9){
     if(loop.value==='second'){
       holes=kpSecond9; cr=35.0; sr=128; par=36; table=kpSecond9Table;
       note='De Kroonprins geel heren • 2e 9 • CR 35,0 / SR 128 • baanhcp volgens 9-holes berekening.';
     }else{
       holes=kpFirst9; cr=34.5; sr=132; par=35; table=kpFirst9Table;
       note='De Kroonprins geel heren • 1e 9 • CR 34,5 / SR 132 • baanhcp volgens 9-holes berekening.';
     }
   }else{
     holes=kpMain18; cr=69.4; sr=130; par=71; table=kp18Table;
     note='De Kroonprins geel heren • 18 holes • CR 69,4 / SR 130 • baanhcp volgens 18-holes berekening.';
   }
 }else{
   holes=kpPar3First9; cr=24.6; sr=67; par=27; table=kpPar3_9Table;
   note='';
 }
 return {h,c,n,holes,cr,sr,par,table,note};
}

function isKpPar3(){
 return course.value==='kroonprins' && false;
}

function getCourseHcp(cfg){
 const h=cfg.h;
 if(cfg.c==='crimpenerhout' && cfg.n===18){
   // Crimpenerhout uses the supplied official 18-hole table.
   const t=[
    [-10,0.2,0],[0.3,1.2,1],[1.3,2.2,0],[2.3,3.2,1],[3.3,4.2,2],
    [4.3,5.2,3],[5.3,6.2,4],[6.3,7.2,5],[7.3,8.2,6],[8.3,9.2,7],
    [9.3,10.2,8],[10.3,11.2,9],[11.3,12.1,10],[12.2,13.1,11],[13.2,14.1,12],
    [14.2,15.1,13],[15.2,16.1,14],[16.2,17.1,15],[17.2,18.1,16],[18.2,19.1,17],
    [19.2,20.1,18],[20.2,21.1,19],[21.2,22.1,20],[22.2,23.0,21],[23.1,24.0,22],
    [24.1,25.0,23],[25.1,26.0,24],[26.1,27.0,25],[27.1,28.0,26],[28.1,29.0,27],
    [29.1,30.0,28],[30.1,31.0,29],[31.1,32.0,30],[32.1,33.0,31],[33.1,33.9,32],
    [34.0,34.9,33],[35.0,35.9,34],[36.0,36.9,35],[37.0,37.9,36],[38.0,38.9,37],
    [39.0,39.9,38],[40.0,40.9,39],[41.0,41.9,40],[42.0,42.9,41],[43.0,43.9,42],
    [44.0,44.9,43],[45.0,45.8,44],[45.9,46.8,45],[46.9,47.8,46],[47.9,48.8,47],
    [48.9,49.8,48],[49.9,50.8,49],[50.9,51.8,50],[51.9,52.8,51],[52.9,53.8,52],
    [53.9,54.0,53]
   ];
   return tableHcp(t,h);
 }

 if(cfg.c==='kroonprins'){
   // For De Kroonprins we use the course-handicap calculation that matches
   // the values you supplied for HCP 14.2: 1e 9 = 8, 2e 9 = 7, 18 holes = 15.
   // 9-hole formula: H.I. × SR / 226 + (CR - Par) / 2.
   // 18-hole formula: H.I. × SR / 113 + (CR - Par).
   // The result is truncated to the whole playing handicap.
   const raw = cfg.n===9
     ? h*cfg.sr/226 + (cfg.cr-cfg.par)/2
     : h*cfg.sr/113 + (cfg.cr-cfg.par);
   return Math.floor(raw);
 }

 return tableHcp(cfg.table,h);
}

function strokesForSI(si,cfg){
 const ch=getCourseHcp(cfg);
 if(ch===null || ch<=0) return 0;
 const sorted=[...new Set(cfg.holes.map(x=>x[2]))].sort((a,b)=>a-b);
 const idx=sorted.indexOf(si);
 if(idx<0)return 0;
 const n=sorted.length;
 return Math.floor(ch/n)+(idx<(ch%n)?1:0);
}

function stableford(par,score,si,cfg){
 if(!score)return null;
 return Math.max(0,2+par-(score-strokesForSI(si,cfg)));
}

function storageKey(h){
 return `golf_${course.value}_${round.value}_${loop.value}_h${h}`;
}

function loadScores(){
 for(let i=1;i<=18;i++) scores[i]=+(localStorage.getItem(storageKey(i))||0);
}

function render(){
 const cfg=currentConfig();
 rows.innerHTML='';
 cfg.holes.forEach(h=>{
  const v=scores[h[0]]||0;
  const tr=document.createElement('tr');
  tr.innerHTML=`<td class="hole">${h[0]}</td>
  <td>${h[1]}<span class="ik" id="ik${h[0]}"></span></td>
  <td><div class="scorebox"><button onclick="chg(${h[0]},-1)">−</button><span class="score" id="s${h[0]}">${v||'—'}</span><button onclick="chg(${h[0]},1)">+</button></div></td>
  <td class="sf" id="sf${h[0]}">—</td>`;
  rows.appendChild(tr);
 });

 const ch=getCourseHcp(cfg);
 document.getElementById('courseHcp').textContent=ch===null?'—':ch;
 document.getElementById('crsr').textContent=`${cfg.cr.toFixed(1)} / ${cfg.sr}`;
 document.getElementById('coursePar').textContent=cfg.par;
 document.getElementById('note').textContent=cfg.note;

 let total=0,sft=0;
 cfg.holes.forEach(h=>{
   const v=scores[h[0]]||0;
   const st=strokesForSI(h[2],cfg);
   document.getElementById('ik'+h[0]).textContent=st?` +${st}`:'';
   document.getElementById('s'+h[0]).textContent=v||'—';
   const sf=stableford(h[1],v,h[2],cfg);
   document.getElementById('sf'+h[0]).textContent=sf===null?'—':sf;
   if(v)total+=v;
   if(sf!==null)sft+=sf;
 });
 document.getElementById('total').textContent=total;
 document.getElementById('sfTotal').textContent=sft;
}

function chg(h,d){
 const cfg=currentConfig();
 const hole=cfg.holes.find(x=>x[0]===h);
 const current=scores[h]||0;

 // Before the first tap the field is blank.
 // First + starts at par; first - starts at par - 1.
 let next;
 if(current===0){
   next = hole ? hole[1] : 0;
   if(d<0) next=Math.max(1,next-1);
 }else{
   next=Math.max(1,current+d);
 }

 scores[h]=next;
 localStorage.setItem(storageKey(h),scores[h]);
 render();
}
function resetScores(){
 if(confirm('Alle scores van deze ronde wissen?')){
  for(let i=1;i<=18;i++){scores[i]=0;localStorage.removeItem(storageKey(i));}
  render();
 }
}

function saveSettings(){
 localStorage.setItem('golf_course',course.value);
 localStorage.setItem('golf_round',round.value);
 localStorage.setItem('golf_loop',loop.value);
 localStorage.setItem('golf_hi',hi.value);
}

function updateUI(){
 // Loop selector is relevant only for 9 holes on the main Kroonprins.
 const kpMain9=course.value==='kroonprins' && round.value==='9';
 loopLabel.style.display=kpMain9?'block':'none';

 // The par-3 option is exposed as a separate golfbaan choice.
 // Use an extra option dynamically so the UI remains simple.
 render();
 saveSettings();
}

// Add Par 3 as a distinct course choice.
const par3Option=document.createElement('option');
par3Option.value='kroonprins_par3';
par3Option.textContent='De Kroonprins – Par 3';
course.appendChild(par3Option);

// Override currentConfig for the Par 3 course while retaining all shared logic.
const originalCurrentConfig=currentConfig;
window.currentConfig=function(){
 if(course.value!=='kroonprins_par3') return originalCurrentConfig();
 const h=+hi.value||0,n=+round.value;
 const holes=n===9?kpPar3First9:kpPar3First9.concat(kpPar3Second9);
 const table=n===9?kpPar3_9Table:kpPar3_18Table;
 return {h,c:'kroonprins_par3',n,holes,cr:n===9?24.6:49.2,sr:67,par:n===9?27:54,table,note:`De Kroonprins Par 3 geel heren • ${n} holes • CR ${n===9?'24,6':'49,2'} / SR 67.`};
};

// Event handling.
[course,round,loop,hi].forEach(el=>el.addEventListener('change',()=>{
 loadScores(); updateUI();
}));
hi.addEventListener('input',()=>{saveSettings();render();});

const savedCourse=localStorage.getItem('golf_course');
const savedRound=localStorage.getItem('golf_round');
const savedLoop=localStorage.getItem('golf_loop');
const savedHI=localStorage.getItem('golf_hi');
if(savedCourse)course.value=savedCourse;
if(savedRound)round.value=savedRound;
if(savedLoop)loop.value=savedLoop;
if(savedHI)hi.value=savedHI;

loadScores();
updateUI();

function currentRoundData(){
 const cfg=currentConfig();
 const ch=getCourseHcp(cfg);
 let total=0,sft=0;
 const holes=cfg.holes.map(h=>{
   const score=scores[h[0]]||0;
   const strokes=strokesForSI(h[2],cfg);
   const sf=stableford(h[1],score,h[2],cfg);
   if(score) total+=score;
   if(sf!==null) sft+=sf;
   return {hole:h[0],par:h[1],si:h[2],score,strokes,sf};
 });
 return {
   date:new Date().toLocaleDateString('nl-NL'),
   time:new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}),
   course:course.options[course.selectedIndex].text,
   round:round.options[round.selectedIndex].text,
   loop:loop.options[loop.selectedIndex].text,
   handicap:+hi.value||0,
   courseHcp:ch,
   total,sft,holes
 };
}

function getHistory(){
 try{return JSON.parse(localStorage.getItem('golf_history')||'[]')}catch(e){return []}
}
function saveRound(){
 const data=currentRoundData();
 if(!data.holes.some(x=>x.score)){
   alert('Vul eerst minimaal één score in.');
   return;
 }
 const history=getHistory();
 history.unshift(data);
 localStorage.setItem('golf_history',JSON.stringify(history.slice(0,50)));
 renderHistory();
 alert('Ronde opgeslagen.');
}
function renderHistory(){
 const el=document.getElementById('historyList');
 const history=getHistory();
 if(!history.length){el.textContent='Nog geen opgeslagen rondes.';return;}
 el.innerHTML=history.map((r,i)=>{
   const label=`${r.date} — ${r.course} — ${r.round}${r.loop&&r.loop!=='Hele baan'?' ('+r.loop+')':''}`;
   return `<div class="rounditem">
     <button class="roundopen" onclick="openRound(${i})">
       <div><b>${label}</b><div class="roundmeta">Hcp ${r.handicap} • baanhcp ${r.courseHcp} • ${r.total} slagen • ${r.sft} Stableford</div></div>
     </button>
     <button class="delete" onclick="deleteRound(${i})">Wis</button>
   </div>`;
 }).join('');
}
function openRound(i){
 const history=getHistory();
 const r=history[i];
 if(!r)return;

 // Restore the settings first.
 const courseIndex=[...course.options].findIndex(o=>o.text===r.course);
 if(courseIndex>=0) course.value=course.options[courseIndex].value;
 const roundIndex=[...round.options].findIndex(o=>o.text===r.round);
 if(roundIndex>=0) round.value=round.options[roundIndex].value;
 const loopIndex=[...loop.options].findIndex(o=>o.text===r.loop);
 if(loopIndex>=0) loop.value=loop.options[loopIndex].value;
 hi.value=r.handicap;

 // Clear current scores and restore saved scores.
 for(let n=1;n<=18;n++) scores[n]=0;
 r.holes.forEach(x=>{scores[x.hole]=x.score||0});

 // Persist the restored round as the current round.
 localStorage.setItem('golf_hi',hi.value);
 localStorage.setItem('golf_course',course.value);
 localStorage.setItem('golf_round',round.value);
 localStorage.setItem('golf_loop',loop.value);
 for(let n=1;n<=18;n++){
   localStorage.setItem(storageKey(n),scores[n]||0);
 }
 render();
 window.scrollTo({top:0,behavior:'smooth'});
}

function deleteRound(i){
 const history=getHistory();
 if(confirm('Deze opgeslagen ronde verwijderen?')){
   history.splice(i,1);
   localStorage.setItem('golf_history',JSON.stringify(history));
   renderHistory();
 }
}
function printRound(){
 const data=currentRoundData();
 if(!data.holes.some(x=>x.score)){
   alert('Vul eerst minimaal één score in.');
   return;
 }
 window.print();
}
</script>
</body>
